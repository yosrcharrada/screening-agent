[pytest]
# Pytest configuration for WP3 scoring engine

# Where to find tests
testpaths = tests

# Python files to search for tests
python_files = test_*.py

# Python classes to search for tests
python_classes = Test*

# Python functions to search for tests
python_functions = test_*

# Minimum version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Show extra test summary info
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -ra

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for complete workflows
    xai: Tests for explainable AI features
    slow: Tests that take longer to run

# Coverage options (optional)
# Uncomment if you install pytest-cov
# addopts = --cov=app --cov-report=html --cov-report=term